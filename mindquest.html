<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindQuest · Learn. Level Up. Lead.</title>
<style>
  :root { --pink:#e0457b; --pink-dark:#c4245f; --ink:#2a1d24; --muted:#7a6670; --bg:#fff7fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; }
  .logo { font-family: Georgia, 'DejaVu Serif', serif; font-weight:700; font-size:1.5rem; }
  .logo span { color:var(--pink); }
  .hero { text-align:center; padding:24px 24px 8px; }
  .eyebrow { letter-spacing:.18em; text-transform:uppercase; font-size:.75rem; color:var(--muted); }
  .hero h1 { font-family: Georgia, 'DejaVu Serif', serif; font-size:clamp(2rem,6vw,3.2rem); margin:12px 0; line-height:1.1; }
  .hero h1 em { color:var(--pink); }
  .hero p { color:var(--muted); max-width:460px; margin:0 auto; line-height:1.6; }
  .cta { display:inline-block; margin-top:22px; background:var(--pink); color:#fff; padding:14px 28px; border-radius:999px; text-decoration:none; font-weight:600; box-shadow:0 10px 24px rgba(224,69,123,.3); }
  .cta:hover { background:var(--pink-dark); }

  .showcase { margin:28px auto 40px; max-width:900px; padding:0 12px; }
  .stage { display:flex; align-items:center; justify-content:center; gap:12px; }
  .slides { position:relative; width:100%; max-width:300px; overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; }
  .slides:active { cursor:grabbing; }
  .track { display:flex; transition:transform .5s cubic-bezier(.45,0,.2,1); will-change:transform; }
  .track.dragging { transition:none; }
  .slide { flex:0 0 100%; display:flex; flex-direction:column; align-items:center; padding:0 4px; }
  .phone { width:100%; max-width:260px; border-radius:34px; padding:9px; background:#1d1419; box-shadow:0 18px 44px rgba(42,29,36,.25); }
  .phone img { display:block; width:100%; border-radius:25px; pointer-events:none; }
  figcaption { text-align:center; margin-top:20px; padding:0 8px; }
  figcaption h3 { font-family: Georgia, 'DejaVu Serif', serif; font-size:1.2rem; margin-bottom:6px; }
  figcaption p { color:var(--muted); font-size:.92rem; line-height:1.5; }
  .arrow { width:34px; height:34px; border-radius:50%; border:1px solid #ead3dc; background:#fff; color:var(--muted); font-size:1rem; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .arrow:hover { color:var(--pink); border-color:var(--pink); }
  .controls { display:flex; justify-content:center; margin-top:18px; }
  .dots { display:flex; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; border:0; background:#ead3dc; cursor:pointer; padding:0; transition:width .3s, background .3s; }
  .dot.active { background:var(--pink); width:22px; border-radius:999px; }

  @media (max-width: 600px) {
    .arrow { display:none; }
    header { padding:16px 18px; }
    .hero { padding:16px 20px 0; }
    .hero h1 { font-size:2rem; }
    .cta { display:block; text-align:center; margin-top:18px; }
    .showcase { margin:24px auto 32px; }
    .stage { gap:0; }
    .slides { max-width:100%; }
    .phone { max-width:240px; }
  }

  footer { text-align:center; color:var(--muted); font-size:.9rem; padding:24px; }
</style>
</head>

<script>
  // PASTE YOUR DROPBOX LINK BETWEEN THE QUOTES BELOW
  const APK_URL = 'https://download843.mediafire.com/xky2czy2n69gPLAzj4E-FyM5XgLQaXZ5uWnUmrBfAlfqZqElPKmigvlx4bB41Lg1dRbFQwdAPrV9bVvOEuBfa7bLiclRTinX-JNjWVj0hFz7_Q7hQN8B5h-oKYJ9Posj8Dcbxj6F4KltW9Un54uxA2uVLE95w2DpTmyhiAjpOR6SzLs8/gjq4efo5bq5hot0/Mind+Quest_1.0.apk';
  let dlUrl = APK_URL;
  

  const dl = document.getElementById('download');
  dl.href = dlUrl;
  dl.setAttribute('download', '');

  const track = document.getElementById('track');
  const slidesEl = document.getElementById('slides');
  const realCount = track.children.length;
  track.appendChild(track.children[0].cloneNode(true)); // seamless loop clone
  const dots = document.querySelectorAll('.dot');
  const INTERVAL = 2000;
  let current = 0, startX = 0, dx = 0, dragging = false, startT = 0, timer;

  function go(n, animate = true) {
    current = n;
    track.classList.toggle('dragging', !animate);
    track.style.transform = `translateX(${-current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current % realCount));
  }
  function settle(n) {
    go(n);
    if (current === realCount) setTimeout(() => go(0, false), 520); // jump back to real first slide
  }
  function next() { settle(current + 1); }
  function prev() {
    if (current === 0) {
      go(realCount, false);
      requestAnimationFrame(() => requestAnimationFrame(() => settle(realCount - 1)));
    } else settle(current - 1);
  }
  function startAuto() { clearInterval(timer); timer = setInterval(next, INTERVAL); }
  function stopAuto() { clearInterval(timer); }

  slidesEl.addEventListener('pointerdown', e => {
    dragging = true; startX = e.clientX; dx = 0; startT = Date.now();
    track.classList.add('dragging');
    slidesEl.setPointerCapture(e.pointerId);
    stopAuto();
  });
  slidesEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - startX;
    track.style.transform = `translateX(calc(${-current * 100}% + ${dx}px))`;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    const w = slidesEl.offsetWidth;
    const velocity = dx / Math.max(1, Date.now() - startT);
    let target = current;
    if (dx < -w * 0.2 || velocity < -0.4) target = current + 1;
    else if (dx > w * 0.2 || velocity > 0.4) target = current - 1;
    settle(Math.max(0, Math.min(realCount, target)));
    startAuto();
  }
  slidesEl.addEventListener('pointerup', endDrag);
  slidesEl.addEventListener('pointercancel', endDrag);

  document.getElementById('prev').onclick = () => { prev(); startAuto(); };
  document.getElementById('next').onclick = () => { next(); startAuto(); };
  dots.forEach((d, i) => d.onclick = () => { settle(i); startAuto(); });
  go(0, false);
  startAuto();
</script>
